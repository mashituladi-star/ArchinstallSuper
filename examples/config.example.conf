# ArchinstallSuper unattended installation configuration.
# Copy this file, edit the values, and run:
#   bash install.sh --config myconfig.conf --auto
#
# Passwords are read from this file but never written to the log.
# Review file permissions (chmod 600) before storing passwords here.

[system]
hostname = archlinux
username = alice
timezone = Europe/Prague
locale = en_US.UTF-8
keymap = us
root_policy = password
zram = false

[install]
mode = minimal
desktop = gnome
kernel = linux
filesystem = ext4
encryption = false
root_password = CHANGE_ME
user_password = CHANGE_ME
luks_password = CHANGE_ME
efi_size_mib = 1024

[disk]
device = /dev/nvme0n1
efi_size_mib = 1024

[packages]
extra = git vim htop

[network]
# wifi_ssid = MyNetwork
# wifi_password = secret
